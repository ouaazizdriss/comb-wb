# Only the ingress controller may reach Comb, so only it can set forwarding headers.
# Egress stays open because Comb must reach your databases; narrow it to their CIDRs in production.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: comb, app.kubernetes.io/instance: {{ .Release.Name }} }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml .Values.ingressFrom.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels: {{- toYaml .Values.ingressFrom.podLabels | nindent 14 }}
      ports: [{ port: 8080 }]

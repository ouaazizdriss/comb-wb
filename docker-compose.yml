# Development only. Ports bind to 127.0.0.1 so the dev databases are never exposed on the LAN.
services:
  db:
    image: postgres:16
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${COMB_DEV_PG_PASSWORD:-postgres-dev-only}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - combdb:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
volumes:
  combdb:
